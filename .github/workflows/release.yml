name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - name: Zip module
        run: zip -r module.zip module.json packs/ README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json